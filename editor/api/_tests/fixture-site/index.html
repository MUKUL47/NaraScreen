<!doctype html>
<!--
  Acme Tasks: a small, fake team task-tracker used as NaraScreen's demo and
  test target. Plain HTML/CSS/JS, no build step, no network. Every route is a
  hash route (#/login, #/dashboard, #/tasks, #/settings), so this one file
  serves the whole app. Any non-empty email + password signs in.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Acme Tasks</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="app"></div>
    <!-- Toasts are announced politely; the container stays in the DOM so screen
         readers pick up every message added to it. -->
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <noscript><p class="noscript">Acme Tasks needs JavaScript.</p></noscript>
    <script src="app.js"></script>
  </body>
</html>
